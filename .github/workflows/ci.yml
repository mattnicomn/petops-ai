name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: TypeScript check (backend)
        run: cd packages/backend && npx tsc --noEmit

      - name: TypeScript check (frontend)
        run: cd packages/frontend && npx tsc --noEmit

      - name: Run tests
        run: npx vitest --run

      - name: Build backend
        run: cd packages/backend && node build.mjs

      - name: Build frontend
        run: cd packages/frontend && npx vite build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14'

      - name: Terraform fmt check
        run: cd infrastructure/terraform && terraform fmt -check

      - name: Terraform init (no backend)
        run: cd infrastructure/terraform && terraform init -backend=false

      - name: Terraform validate
        run: cd infrastructure/terraform && terraform validate
